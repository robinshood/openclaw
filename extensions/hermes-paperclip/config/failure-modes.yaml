# Mandatory failure mode checks (Inversion principle)
# Every decision must be checked against ALL failure modes before proceeding.

failure_modes:
  - id: OVERSPEND
    description: "Paying for software/services no one uses"
    severity: HIGH
    indicators:
      - "Low utilization metrics"
      - "Licenses without active users"
      - "Duplicate functionality across tools"
    mitigation: "Run utilization audit before any new software purchase"

  - id: DISRUPTION
    description: "Breaking a working process during integration"
    severity: HIGH
    indicators:
      - "Replacing systems without parallel run period"
      - "No rollback plan documented"
      - "Forcing migration timeline on portfolio company"
    mitigation: "Always run parallel systems for minimum 30 days"

  - id: KNOWLEDGE_LOSS
    description: "Losing tacit knowledge when employees leave"
    severity: CRITICAL
    indicators:
      - "Employees near retirement age (65+)"
      - "Single person responsible for critical process"
      - "No documentation of key workflows"
    mitigation: "Knowledge capture sessions before any transition"

  - id: DATA_LEAK
    description: "Mixing data between portfolio companies (tenant isolation failure)"
    severity: CRITICAL
    indicators:
      - "Shared database without tenant isolation"
      - "Cross-company API access"
      - "Shared credentials or service accounts"
    mitigation: "Enforce tenant isolation via Keycloak RBAC at all layers"

  - id: PREMATURE_AUTOMATION
    description: "Automating a process you don't understand yet"
    severity: HIGH
    indicators:
      - "No process map exists"
      - "Process owner not interviewed"
      - "Edge cases not documented"
    mitigation: "Complete Workshop sprint (process mapping) before any automation"

  - id: DEPENDENCY_CREATION
    description: "Making portfolio company dependent on Ett Capital infrastructure"
    severity: MEDIUM
    indicators:
      - "Portfolio company cannot operate if Ett Capital systems go down"
      - "Single point of failure in shared infrastructure"
      - "No standalone fallback documented"
    mitigation: "Every integration must have documented standalone fallback"

  - id: MISSED_STANDARD
    description: "Building custom when Propell.ai/Sanna/TripleTex already covers it"
    severity: MEDIUM
    indicators:
      - "Building functionality that OOTB tool already provides"
      - "Not checking OOTB registry before development"
      - "Custom solution for standard accounting/HR/ERP process"
    mitigation: "Always check ootb-registry.yaml before building anything custom"

  - id: STALE_DATA
    description: "Making decisions based on information older than 30 days"
    severity: MEDIUM
    indicators:
      - "Data source last updated > 30 days ago"
      - "Using estimates instead of measured values"
      - "No verification date on truth statements"
    mitigation: "Re-verify all data sources before any decision"
