# Service catalog — defines services delivered by Ett Capital to portfolio companies
# All pricing follows arm's length principle (armlengdeprinsippet)

services:
  - id: "svc-process-automation"
    name: "Process Automation"
    description: "Identify, build, and deploy automated workflows for manual processes"
    tier: STANDARD
    sla:
      - metric: "Sprint delivery"
        target: "2-week sprint cycles"
      - metric: "Automation uptime"
        target: "99.5%"
    pricing_basis: "Hours consumed + fixed sprint fee"

  - id: "svc-intelligence-monitoring"
    name: "Intelligence & Monitoring"
    description: "Continuous KPI monitoring, anomaly detection, and alerting"
    tier: PREMIUM
    sla:
      - metric: "Alert response time"
        target: "< 15 minutes for CRITICAL"
      - metric: "Data freshness"
        target: "< 24 hours"
      - metric: "Monitoring uptime"
        target: "99.9%"
    pricing_basis: "Monthly fixed fee per company"

  - id: "svc-onboarding"
    name: "Portfolio Company Onboarding"
    description: "Day 1 to Month 3 onboarding: process mapping, gap analysis, first sprint"
    tier: STANDARD
    sla:
      - metric: "Day 1 completion"
        target: "System access + initial data collection"
      - metric: "Month 1 completion"
        target: "Process map + gap analysis + first sprint planned"
      - metric: "Month 3 completion"
        target: "Full integration + KPI baseline established"
    pricing_basis: "Fixed onboarding fee"

  - id: "svc-reporting"
    name: "Executive Reporting"
    description: "Weekly status reports, KPI dashboards, and incident reports"
    tier: BASIC
    sla:
      - metric: "Weekly report delivery"
        target: "Every Monday by 09:00 CET"
      - metric: "Dashboard data freshness"
        target: "< 1 hour"
    pricing_basis: "Included in monitoring fee"
