# Best-of-breed platform analysis
# Technical analysis of each OOTB platform in the portfolio company stack

platforms:
  propell_ai:
    name: "Propell.ai"
    category: "Accounting Automation"
    website: "https://propell.ai"

    capabilities:
      - "AI-powered voucher matching (23-40% no-touch rate)"
      - "Automated bank reconciliation"
      - "Credit card and expense management"
      - "Supplier invoice processing"

    api_analysis:
      type: "REST"
      authentication: "API key + OAuth 2.0"
      webhooks: true
      rate_limits: "Standard tier: 100 req/min"
      documentation_quality: "Good — Norwegian-focused"
      sdk_available: false

    integrations:
      native:
        - { system: "TripleTex", quality: "Deep", notes: "Primary ERP integration" }
        - { system: "Norwegian banks", quality: "Deep", notes: "Direct bank feeds" }
      api_based:
        - { system: "PowerBI", quality: "Medium", notes: "Via data export" }

    strengths:
      - "Purpose-built for Norwegian accounting standards"
      - "AI learns firm-specific voucher patterns over time"
      - "Reduces manual bilagshåndtering significantly"
      - "Active development and Norwegian support"

    limitations:
      - "No custom workflow builder"
      - "Limited reporting API (dashboard only)"
      - "No multi-tenant self-service portal"
      - "Partial coverage only — still requires manual review"

    fit_assessment:
      accounting_firms: { score: 4.2, notes: "Core tool for bilagshåndtering automation" }
      hospitality: { score: 1.5, notes: "Not relevant for hotel operations" }

  sanna:
    name: "Sanna"
    category: "HR/Payroll"
    website: "https://sanna.no"

    capabilities:
      - "Full payroll processing (lønn)"
      - "Holiday pay calculation (feriepenger)"
      - "Tax deduction management (skattetrekk)"
      - "A-melding reporting to Altinn"
      - "Norwegian labor law compliance"

    api_analysis:
      type: "REST"
      authentication: "API key"
      webhooks: false
      rate_limits: "Not published"
      documentation_quality: "Limited"
      sdk_available: false

    integrations:
      native:
        - { system: "Altinn", quality: "Deep", notes: "Direct A-melding submission" }
        - { system: "Skatteetaten", quality: "Deep", notes: "Tax calculations" }
      api_based:
        - { system: "TripleTex", quality: "Basic", notes: "Manual sync possible" }

    strengths:
      - "Full Norwegian labor law compliance"
      - "Automatic tax calculations"
      - "Handles complex payroll scenarios (overtime, shifts)"
      - "Altinn integration for regulatory reporting"

    limitations:
      - "Manual employee onboarding process"
      - "No API for custom reports"
      - "No webhooks for real-time events"
      - "Limited integration options"

    fit_assessment:
      accounting_firms: { score: 3.8, notes: "Handles payroll for clients" }
      hospitality: { score: 4.0, notes: "Good for shift-based payroll" }

  tripletex:
    name: "TripleTex"
    category: "ERP/Accounting"
    website: "https://tripletex.no"

    capabilities:
      - "Full double-entry accounting (regnskap)"
      - "Invoicing and accounts receivable (fakturering)"
      - "Bank integration and reconciliation"
      - "VAT calculations and reporting (MVA)"
      - "Project management and time tracking"
      - "Asset management"

    api_analysis:
      type: "REST v2"
      authentication: "Session token + consumer token"
      webhooks: true
      rate_limits: "Depends on plan tier"
      documentation_quality: "Comprehensive — well-documented API v2"
      sdk_available: true

    integrations:
      native:
        - { system: "Propell.ai", quality: "Deep", notes: "Primary automation partner" }
        - { system: "Norwegian banks", quality: "Deep", notes: "Direct bank feeds" }
        - { system: "Altinn", quality: "Deep", notes: "Tax and VAT submission" }
      api_based:
        - { system: "PowerBI", quality: "Good", notes: "Via API data extraction" }
        - { system: "Sanna", quality: "Basic", notes: "Manual data sync" }

    strengths:
      - "Most comprehensive Norwegian ERP for SMBs"
      - "Excellent API (v2) for custom integrations"
      - "Strong bank integration ecosystem"
      - "Active development, large user base in Norway"

    limitations:
      - "Complex initial setup and configuration"
      - "Steep learning curve for new users"
      - "Limited automation beyond basic workflows"
      - "Per-user licensing can be expensive at scale"

    fit_assessment:
      accounting_firms: { score: 4.0, notes: "Core ERP — already in use at Systemregnskap" }
      hospitality: { score: 3.0, notes: "Usable but not hospitality-specific" }

  powerbi:
    name: "PowerBI"
    category: "Reporting/Dashboards"
    website: "https://powerbi.microsoft.com"

    capabilities:
      - "Interactive dashboards and reports"
      - "KPI visualization"
      - "Data aggregation from multiple sources"
      - "Scheduled data refresh"
      - "Embedded analytics"

    api_analysis:
      type: "REST + Embedded"
      authentication: "Azure AD / OAuth 2.0"
      webhooks: false
      rate_limits: "Azure tier-dependent"
      documentation_quality: "Excellent — Microsoft Docs"
      sdk_available: true

    integrations:
      native:
        - { system: "Excel", quality: "Deep", notes: "Native Microsoft integration" }
        - { system: "SQL databases", quality: "Deep", notes: "DirectQuery + Import" }
      api_based:
        - { system: "TripleTex", quality: "Good", notes: "Via API connector" }
        - { system: "Propell.ai", quality: "Medium", notes: "Via data export" }

    strengths:
      - "Industry-leading visualization engine"
      - "Connects to virtually any data source"
      - "Embedded analytics for custom dashboards"
      - "Strong mobile experience"

    limitations:
      - "Requires data pipeline setup (not plug-and-play)"
      - "Per-user licensing cost (Pro: ~NOK 100/user/month)"
      - "Learning curve for DAX/Power Query"
      - "Azure dependency"

    fit_assessment:
      accounting_firms: { score: 3.5, notes: "Good for KPI dashboards, requires setup" }
      hospitality: { score: 4.0, notes: "Strong for RevPAR/occupancy dashboards" }
