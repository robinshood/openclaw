# Domain knowledge — Norwegian accounting firm (regnskapsfirma) industry
# Source: Kartlegging regnskapsfirmaer (industry mapping meetings)

industry:
  name: "Regnskapsbransjen (Accounting industry)"
  country: "Norway"
  regulatory_body: "Finanstilsynet"
  professional_org: "Regnskap Norge"

  market_characteristics:
    - "Highly fragmented — many small firms (1-10 employees)"
    - "Consolidation trend — larger firms acquiring smaller ones"
    - "Regulatory pressure increasing (anti-money laundering, GDPR)"
    - "Digital transformation lagging compared to other industries"
    - "Client relationships are personal and long-term (10-20+ years)"
    - "Generational shift — many founders/senior staff approaching retirement"

  key_metrics:
    revenue_per_employee:
      benchmark_low: 2000000 # NOK
      benchmark_mid: 3000000
      benchmark_high: 3500000
      unit: "NOK"
      notes: "Well-automated firms reach 3.5M+. Manual-heavy firms stay around 2.0-2.5M."

    customer_churn_rate:
      benchmark: 5.0
      unit: "percent"
      notes: "Accounting clients are sticky. Churn > 5% is a warning sign."

    voucher_per_customer:
      benchmark_small: 20
      benchmark_medium: 50
      benchmark_large: 200
      unit: "vouchers/month"
      notes: "Varies wildly by client size and industry."

  common_processes:
    core:
      - {
          name: "Bilagshåndtering",
          english: "Voucher handling",
          automation_potential: "HIGH",
          notes: "Largest time sink. AI voucher matching is game-changer.",
        }
      - {
          name: "Bankavstemming",
          english: "Bank reconciliation",
          automation_potential: "HIGH",
          notes: "Fully automatable with Propell.ai or similar.",
        }
      - {
          name: "MVA-rapportering",
          english: "VAT reporting",
          automation_potential: "HIGH",
          notes: "Bi-monthly. TripleTex calculates, submission can be automated.",
        }
      - {
          name: "Lønn",
          english: "Payroll",
          automation_potential: "MEDIUM",
          notes: "Sanna or similar. Client-specific rules add complexity.",
        }
      - {
          name: "Årsoppgjør",
          english: "Year-end closing",
          automation_potential: "LOW",
          notes: "Requires professional judgment. Cannot fully automate.",
        }
      - {
          name: "Fakturering",
          english: "Invoicing",
          automation_potential: "HIGH",
          notes: "Recurring invoices easily automated in TripleTex.",
        }
      - {
          name: "Selvangivelser",
          english: "Tax returns",
          automation_potential: "LOW",
          notes: "Regulatory complexity. Expert knowledge required.",
        }

    support:
      - { name: "Kunderegistrering", english: "Customer onboarding", automation_potential: "HIGH" }
      - { name: "Klientrapportering", english: "Client reporting", automation_potential: "HIGH" }
      - {
          name: "Dokumenthåndtering",
          english: "Document management",
          automation_potential: "MEDIUM",
        }
      - { name: "Innbetalingskontroll", english: "Payment control", automation_potential: "HIGH" }
      - {
          name: "Kredittkort/utlegg",
          english: "Credit card/expenses",
          automation_potential: "HIGH",
        }

  technology_landscape:
    dominant_erp:
      - { name: "TripleTex", market_share: "Large among SMBs" }
      - { name: "Visma", market_share: "Enterprise segment" }
      - { name: "PowerOffice Go", market_share: "Growing competitor" }
    automation:
      - { name: "Propell.ai", focus: "Voucher automation" }
      - { name: "Duett", focus: "Payroll" }
      - { name: "Sanna", focus: "HR/Payroll" }
    reporting:
      - { name: "PowerBI", focus: "Dashboards" }
      - { name: "Silverfin", focus: "Accounting workflow + reporting" }

  risk_factors:
    generational_cliff:
      description: "Many senior accountants (55-70) retiring within 5-10 years"
      impact: "Knowledge loss, client relationship disruption"
      mitigation: "Early knowledge capture, documentation, succession planning"

    regulatory_pressure:
      description: "Increasing AML/GDPR/accounting standard requirements"
      impact: "More compliance work, higher error cost"
      mitigation: "Automated compliance checks, documentation"

    digital_divide:
      description: "Firms that digitize win. Those that don't will be acquired or fade."
      impact: "Competitive pressure, margin squeeze"
      mitigation: "Phased digitization starting with highest-impact processes"

    client_concentration:
      description: "Some firms have 10-20% of revenue from single client"
      impact: "Revenue risk if key client leaves"
      mitigation: "Diversification, excellent service, contractual protections"
