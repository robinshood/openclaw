# Technical Review Framework for Portfolio Company Tech Stacks
# Used by Hermes during Step 2 (Infrastructure Mapping) to evaluate
# Spring Boot 4 / Java 21+ / Supply Chain Security compliance.
#
# Each check maps to an existing Hermes/Paperclip failure mode.

categories:
  - id: architecture
    name: "Modern Architectural Patterns"
    description: "Spring Boot 4 & Java 21+ best practices"
    checks:
      - id: arch-01
        name: "Virtual Threads (Project Loom)"
        description: "I/O-bound workloads use virtual threads instead of heavy thread pools"
        verification: "Check for spring.threads.virtual.enabled=true; scan for synchronized blocks that should use ReentrantLock"
        failureMode: OVERSPEND
        severity: MEDIUM
        springBootVersion: "4.0+"
        javaVersion: "21+"

      - id: arch-02
        name: "Event-Driven Architecture"
        description: "State-changing operations triggered via events (Kafka/RabbitMQ), REST reserved for queries"
        verification: "Review controller endpoints; state mutations should publish events, not use direct REST calls"
        failureMode: PREMATURE_AUTOMATION
        severity: HIGH

      - id: arch-03
        name: "Workflow Engine for Saga Logic"
        description: "Complex retries and durable state machines handled by Temporal/similar, not manual cron jobs"
        verification: "Search for @Scheduled with retry logic; these should be Temporal workflows"
        failureMode: DISRUPTION
        severity: HIGH
        tools: ["Temporal", "Camunda"]

      - id: arch-04
        name: "API Layering (GraphQL Federation)"
        description: "Public APIs use GraphQL Federation to prevent over/under-fetching; REST stays internal"
        verification: "Check public API surface for GraphQL schema; internal services may use REST"
        failureMode: OVERSPEND
        severity: LOW

      - id: arch-05
        name: "AOT Compilation & Native Images"
        description: "GraalVM native images for startup <60ms and reduced RAM in scale-to-zero environments"
        verification: "Check for spring-boot-maven-plugin native profile or GraalVM build config"
        failureMode: OVERSPEND
        severity: MEDIUM

  - id: security
    name: "Security & Supply Chain Integrity"
    description: "SLSA, SBOM, and application security"
    checks:
      - id: sec-01
        name: "SLSA Level 3 Compliance"
        description: "Isolated, ephemeral build environments with signed provenance attestations linking artifacts to git commits"
        verification: "Check CI/CD pipeline for hermetic builds, provenance generation (e.g. cosign, in-toto)"
        failureMode: DATA_LEAK
        severity: CRITICAL

      - id: sec-02
        name: "SBOM Generation (CycloneDX 1.6+)"
        description: "Automated SBOM generation during build phase with vulnerability tracking (VEX) and dependency graph"
        verification: "Check build plugins for cyclonedx-maven-plugin or cyclonedx-gradle-plugin; verify VEX support"
        failureMode: STALE_DATA
        severity: HIGH

      - id: sec-03
        name: "VEX Documents"
        description: "Vulnerability Exploitability Exchange documents filter noise by marking non-exploitable CVEs"
        verification: "Check for .vex.json files or VEX integration in vulnerability scanner output"
        failureMode: STALE_DATA
        severity: MEDIUM

      - id: sec-04
        name: "Assured Dependencies"
        description: "Third-party packages sourced from curated repositories (Google Assured OSS) to prevent typosquatting"
        verification: "Check dependency sources; verify no direct pulls from untrusted registries"
        failureMode: DATA_LEAK
        severity: HIGH
        tools: ["Google Assured OSS", "Sonatype Nexus"]

      - id: sec-05
        name: "Session & Resource Control"
        description: "Strict session limits via Redis sliding windows to prevent resource exhaustion/DoS"
        verification: "Check for rate limiting configuration; verify Redis-based session management"
        failureMode: DISRUPTION
        severity: HIGH

      - id: sec-06
        name: "Timing Attack Mitigation"
        description: "Authentication uses constant-time comparisons (Argon2id) with dummy operations for non-existent users"
        verification: "Review auth endpoints for timing-safe password comparison and user enumeration prevention"
        failureMode: DATA_LEAK
        severity: CRITICAL

      - id: sec-07
        name: "IDOR & Authorization"
        description: "Controller endpoints enforce role-based access control with subject-ID JWT validation"
        verification: "Check for @PreAuthorize annotations; verify JWT subject-ID matches resource owner"
        failureMode: DATA_LEAK
        severity: CRITICAL

      - id: sec-08
        name: "Secrets Management"
        description: "No hardcoded credentials; all secrets via Vault or environment variables"
        verification: "Scan for hardcoded passwords, API keys, connection strings in source code"
        failureMode: DATA_LEAK
        severity: CRITICAL
        tools: ["HashiCorp Vault", "AWS Secrets Manager"]

  - id: build
    name: "Build Infrastructure & Developer Experience"
    description: "Consistency and governance in build tooling"
    checks:
      - id: build-01
        name: "Gradle Convention Plugins"
        description: "Central build-logic module defines shared conventions (JVM versions, security scans, linting)"
        verification: "Check for buildSrc/ or build-logic/ module with convention plugins applied to all subprojects"
        failureMode: DEPENDENCY_CREATION
        severity: MEDIUM

      - id: build-02
        name: "Architecture Decision Records"
        description: "ADRs document architectural patterns as markdown, serving as context for both humans and AI agents"
        verification: "Check for docs/adr/ or decisions/ directory with numbered ADR files"
        failureMode: KNOWLEDGE_LOSS
        severity: HIGH

      - id: build-03
        name: "Modular Starters"
        description: "Dependencies use modular starters instead of monolithic parent to reduce attack surface"
        verification: "Check pom.xml/build.gradle for fine-grained starter dependencies vs spring-boot-starter-parent"
        failureMode: OVERSPEND
        severity: LOW

  - id: migration
    name: "Migration Strategy"
    description: "Upgrading from Spring Boot 2.x/3.x"
    checks:
      - id: mig-01
        name: "OpenRewrite Automated Refactoring"
        description: "Large-scale upgrades orchestrated via OpenRewrite (Jakarta EE 11, Java 17/25, JUnit 6)"
        verification: "Check for rewrite-maven-plugin or OpenRewrite Gradle plugin in build configuration"
        failureMode: MISSED_STANDARD
        severity: MEDIUM
        tools: ["OpenRewrite"]

      - id: mig-02
        name: "Jakarta EE 11 Namespace Migration"
        description: "javax.* packages migrated to jakarta.* namespace"
        verification: "Scan for remaining javax.* imports that should be jakarta.*"
        failureMode: STALE_DATA
        severity: HIGH

  - id: data_governance
    name: "Data Governance & Tenant Isolation"
    description: "Multi-tenancy and data segregation for portfolio companies"
    checks:
      - id: data-01
        name: "Keycloak RBAC Tenant Isolation"
        description: "Each portfolio company's data segregated by owner_id with Keycloak JWT enforcement"
        verification: "Check Spring Security config for tenant-aware filters; verify query pre-filtering by owner_id"
        failureMode: DATA_LEAK
        severity: CRITICAL

      - id: data-02
        name: "Audit Trail on All Mutations"
        description: "Every data mutation logged with actor, timestamp, and rationale"
        verification: "Check for @Audited annotations or event sourcing on write operations"
        failureMode: KNOWLEDGE_LOSS
        severity: HIGH

      - id: data-03
        name: "Data Freshness Validation"
        description: "Decision data sources verified within 30-day window before use"
        verification: "Check for lastUpdated/verifiedAt fields on data entities; verify staleness checks"
        failureMode: STALE_DATA
        severity: MEDIUM
