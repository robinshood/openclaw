# Out-of-the-Box (OOTB) tool registry
# Maps what each standard platform covers so Paperclip knows what NOT to build.

platforms:
  propell_ai:
    name: "Propell.ai"
    category: "Accounting Automation"
    processes_covered:
      - process: "bilagshandtering"
        english: "Voucher handling"
        coverage_level: "partial"
        coverage_percent: 23-40
        notes: "23-40% no-touch rate for voucher matching"
      - process: "bankavstemming"
        english: "Bank reconciliation"
        coverage_level: "full"
        notes: "Automated bank statement matching"
      - process: "kredittkort_utlegg"
        english: "Credit card/expenses"
        coverage_level: "full"
        notes: "Expense report and credit card reconciliation"
    integrations:
      - "TripleTex"
      - "Bank APIs (Norwegian banks)"
    api:
      type: "REST"
      webhooks: true
      documentation: "Available on request"
    fit_score: 4.2
    fit_notes: "Excellent for Norwegian accounting firms"

  sanna:
    name: "Sanna"
    category: "HR/Payroll"
    processes_covered:
      - process: "lonn"
        english: "Payroll"
        coverage_level: "full"
        notes: "Full payroll processing with Norwegian tax calculations"
      - process: "feriepenger"
        english: "Holiday pay"
        coverage_level: "full"
      - process: "skattetrekk"
        english: "Tax deduction"
        coverage_level: "full"
      - process: "a_melding"
        english: "A-melding (tax reporting)"
        coverage_level: "full"
    integrations:
      - "Altinn"
      - "Skatteetaten"
    api:
      type: "REST"
      webhooks: false
      documentation: "Limited"
    fit_score: 3.8
    fit_notes: "Strong on Norwegian labor law compliance"

  tripletex:
    name: "TripleTex"
    category: "ERP/Accounting"
    processes_covered:
      - process: "regnskap"
        english: "Accounting"
        coverage_level: "full"
      - process: "fakturering"
        english: "Invoicing"
        coverage_level: "full"
      - process: "mva_rapportering"
        english: "VAT reporting"
        coverage_level: "partial"
        notes: "Supports MVA calculations, but manual submission"
      - process: "bankavstemming"
        english: "Bank reconciliation"
        coverage_level: "partial"
        notes: "Basic bank integration, enhanced by Propell.ai"
    integrations:
      - "Propell.ai"
      - "Norwegian bank APIs"
      - "Altinn"
    api:
      type: "REST v2"
      webhooks: true
      documentation: "Comprehensive"
    fit_score: 4.0
    fit_notes: "Full ERP with strong Norwegian localization"

  powerbi:
    name: "PowerBI"
    category: "Reporting/Dashboards"
    processes_covered:
      - process: "rapportering"
        english: "Reporting"
        coverage_level: "full"
        notes: "Dashboards, KPI visualization, data aggregation"
    integrations:
      - "TripleTex (via API)"
      - "Propell.ai (via API)"
      - "Excel"
      - "SQL databases"
    api:
      type: "REST + Embedded"
      webhooks: false
      documentation: "Microsoft Docs"
    fit_score: 3.5
    fit_notes: "Requires data pipeline setup, per-user licensing cost"
