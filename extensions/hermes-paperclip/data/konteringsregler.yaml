# Konteringsregler — Norwegian accounting classification rules
# DOMAIN REVIEW NEEDED: These are starter rules. A certified accountant must review them.
version: "0.1.0"
lastUpdated: "2026-03-30"

rules:
  - id: KR-001
    category: "Reise — fly"
    accountNumber: 7140
    accountName: Reisekostnad
    vatCode: 0
    vatDescription: "Ingen MVA (transport)"
    matchPatterns:
      merchantKeywords: [sas, norwegian, wideroe, widerøe, flyr, ryanair, easyjet]
      mccCodes: ["3000", "3001", "3002", "3003", "4511"]
      descriptionPatterns: ["\\bfly\\b", "\\bflight\\b", "\\bairline\\b"]
    confidence: high
    requiresReview: false
    source: manual

  - id: KR-002
    category: "Reise — hotell"
    accountNumber: 7140
    accountName: Reisekostnad
    vatCode: 11
    vatDescription: "12% MVA (overnatting)"
    matchPatterns:
      merchantKeywords: [hotel, hotell, scandic, thon, comfort, clarion, radisson, booking.com, airbnb]
      mccCodes: ["7011"]
      descriptionPatterns: ["\\bhotell?\\b", "\\bovernatting\\b", "\\baccommodation\\b"]
    confidence: high
    requiresReview: false
    source: manual

  - id: KR-003
    category: "Reise — taxi"
    accountNumber: 7140
    accountName: Reisekostnad
    vatCode: 1
    vatDescription: "25% MVA"
    matchPatterns:
      merchantKeywords: [taxi, uber, bolt, oslo taxi, norgestaxi]
